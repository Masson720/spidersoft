
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "spidersoft-cadvisor:8080"

  - job_name: "spidersoft-api"
    static_configs:
      - targets:
          - "spidersoft-api:5000"

  - job_name: 'postgres'
    static_configs:
      - targets: ['spidersoft-postgres-exporter:9187']
    metrics_path: '/metrics'
