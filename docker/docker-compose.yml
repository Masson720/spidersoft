services:
  spidersoft-web:
    build: ./web
    image: spidersoft-web:1.1
    container_name: spidersoft-web
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
    volumes:
      - spidersoft-web-data:/usr/share/nginx/html
      - ./web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - spidersoft-network

  spidersoft-api:
    build: ./api
    image: spidersoft-api:1.0
    container_name: spidersoft-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
    networks:
      - spidersoft-network

volumes:
  spidersoft-web-data:

networks:
  spidersoft-network:
    external: true
