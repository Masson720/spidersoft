services:
  spidersoft-web:
    build: ./web
    image: spidersoft-web:1.1
    container_name: spidersoft-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      spidersoft-api:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
    volumes:
      - spidersoft-web-data:/usr/share/nginx/html
      - ./web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - spidersoft-network

  spidersoft-api:
    build: ./api
    image: spidersoft-api:1.0
    container_name: spidersoft-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - spidersoft-network

  spidersoft-db:
    image: postgres:16
    container_name: spidersoft-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - spidersoft-db-data:/var/lib/postgresql/data
    networks:
      - spidersoft-network

  spidersoft-adminer:
    image: adminer:latest
    container_name: spidersoft-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - spidersoft-network

  spidersoft-cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: spidersoft-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - spidersoft-network

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro


volumes:
  spidersoft-web-data:
    name: spidersoft-web-data
  spidersoft-db-data:
    name: spidersoft-db-data

networks:
  spidersoft-network:
    external: true
