services:
  spidersoft-web:
    build: ./web
    image: spidersoft-web:1.1
    container_name: spidersoft-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      spidersoft-api:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
    volumes:
      - spidersoft-web-data:/usr/share/nginx/html
      - ./web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - spidersoft-network
    profiles:
      - core
      - development
      - production

  spidersoft-api:
    build: ./api
    image: ${API_IMAGE}
    container_name: spidersoft-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - spidersoft-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    profiles:
      - core
      - development
      - production

  spidersoft-db:
    image: postgres:16
    container_name: spidersoft-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - spidersoft-db-data:/var/lib/postgresql/data
    networks:
      - spidersoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - core
      - development
      - production

  spidersoft-node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: spidersoft-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - spidersoft-network
    profiles:
      - monitoring
      - production
      - development



  spidersoft-adminer:
    image: adminer:latest
    container_name: spidersoft-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - spidersoft-network
    profiles:
      - tools
      - development


  spidersoft-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: spidersoft-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - spidersoft-network

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    profiles:
      - monitoring
      - production


  spidersoft-prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: spidersoft-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - spidersoft-prometheus-data:/prometheus
    networks:
      - spidersoft-network
    profiles:
      - monitoring
      - production

  spidersoft-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: spidersoft-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@spidersoft-db:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - spidersoft-network
    depends_on:
      spidersoft-db:
        condition: service_healthy
    command:
      - '--collector.postmaster'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - monitoring
      - production
      - development


  spidersoft-grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    container_name: spidersoft-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - spidersoft-grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - spidersoft-network
    depends_on:
      spidersoft-prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - monitoring
      - production
      - development

  spidersoft-loki:
    image: grafana/loki:3.7.5@sha256:f968164e718f9cbe9f5b0f967f3bb6f9cad5d95cf7ffcaf968cce06c941aed62
    container_name: spidersoft-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - spidersoft-loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - spidersoft-network
    profiles:
      - monitoring
      - production
      - development

  spidersoft-promtail:
    image: grafana/promtail:3.6.8@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    container_name: spidersoft-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - spidersoft-network
    depends_on:
      spidersoft-loki:
        condition: service_started
    profiles:
      - monitoring
      - production
      - development

volumes:
  spidersoft-web-data:
    name: spidersoft-web-data
  spidersoft-db-data:
    name: spidersoft-db-data
  spidersoft-prometheus-data:
    name: spidersoft-prometheus-data
  spidersoft-grafana-data:
    name: spidersoft-grafana-data
  spidersoft-loki-data:
    name: spidersoft-loki-data

networks:
  spidersoft-network:
    external: true
