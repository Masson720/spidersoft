services:
  spidersoft-web:
    build: ./web
    image: spidersoft-web:1.1
    container_name: spidersoft-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      spidersoft-api:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
    volumes:
      - spidersoft-web-data:/usr/share/nginx/html
      - ./web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - spidersoft-network
    profiles:
      - core
      - development
      - production

  spidersoft-api:
    build: ./api
    image: spidersoft-api:1.0
    container_name: spidersoft-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - spidersoft-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    profiles:
      - core
      - development
      - production

  spidersoft-db:
    image: postgres:16
    container_name: spidersoft-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - spidersoft-db-data:/var/lib/postgresql/data
    networks:
      - spidersoft-network
    profiles:
      - core
      - development
      - production


  spidersoft-adminer:
    image: adminer:latest
    container_name: spidersoft-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - spidersoft-network
    profiles:
      - tools
      - development


  spidersoft-cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: spidersoft-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - spidersoft-network

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    profiles:
      - monitoring
      - production


  spidersoft-prometheus:
    image: prom/prometheus:latest
    container_name: spidersoft-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - spidersoft-prometheus-data:/prometheus
    networks:
      - spidersoft-network
    profiles:
      - monitoring
      - production

  spidersoft-grafana:
    image: grafana/grafana:latest
    container_name: spidersoft-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - spidersoft-grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - spidersoft-network
    depends_on:
      spidersoft-prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - monitoring
      - production
      - development

  spidersoft-loki:
    image: grafana/loki:latest
    container_name: spidersoft-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - spidersoft-loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - spidersoft-network
    profiles:
      - monitoring
      - production
      - development

  spidersoft-promtail:
    image: grafana/promtail:latest
    container_name: spidersoft-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - spidersoft-network
    depends_on:
      spidersoft-loki:
        condition: service_started
    profiles:
      - monitoring
      - production
      - development

volumes:
  spidersoft-web-data:
    name: spidersoft-web-data
  spidersoft-db-data:
    name: spidersoft-db-data
  spidersoft-prometheus-data:
    name: spidersoft-prometheus-data
  spidersoft-grafana-data:
    name: spidersoft-grafana-data
  spidersoft-loki-data:
    name: spidersoft-loki-data

networks:
  spidersoft-network:
    external: true
