  # ============================================
  # JOB 2: BUILD AND PUBLISH DOCKER IMAGE
  # ============================================
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert repository owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: docker/api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/spidersoft-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/spidersoft-api:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/spidersoft-api:latest

  deploy:
    name: Deploy to SpiderSoft Server (self-hosted)
    runs-on: self-hosted
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deployment script
        run: |
          /opt/spidersoft/scripts/deploy-api.sh ${{ github.sha }}
