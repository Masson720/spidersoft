name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================
  # JOB 1: TEST
  # ============================================
  test:
    name: Test Python Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd docker/api
          pip install -r requirements.txt

      - name: Check app imports
        run: |
          cd docker/api
          python -c "import app; print('✅ Application imports successfully')"

  # ============================================
  # JOB 2: DOCKER BUILD (зависит от test)
  # ============================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # <-- Запускается только после успешного test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd docker/api
          docker build -t spidersoft-api:${{ github.sha }} .

      - name: Verify image exists
        run: |
          docker images | grep spidersoft-api
